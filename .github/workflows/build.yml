# Builds the whiteboard executables for Windows and Linux with PyInstaller, smoke-tests them,
# and runs the test suite on both systems.
#   - every push / pull request: binaries are uploaded as workflow artifacts (Actions tab -> run -> Artifacts)
#   - pushing a tag like v1.0, or running the workflow by hand with a release_tag: the binaries are also
#     attached to a GitHub Release (Releases page)
name: Build executables

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v1.0); leave empty to only build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            ext: .exe
          - os: ubuntu-22.04          # older glibc (2.35), so the binary also runs on older Linux PCs
            label: linux
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q xvfb libportaudio2; fi
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile --name whiteboard-server server.py
          pyinstaller --onefile --windowed --name whiteboard-client client.py
          # console build of the client, only used for the smoke test below (a windowed build hides errors in a dialog)
          pyinstaller --onefile --name whiteboard-client-check client.py

      - name: Smoke test - server executable answers a real client (TLS, PING, web, UDP discovery)
        shell: bash
        run: |
          mkdir smoke && cd smoke
          ../dist/whiteboard-server${{ matrix.ext }} > server.log 2>&1 &
          sleep 8
          cat server.log
          cd .. && python diagnose.py 127.0.0.1

      - name: Smoke test - client executable starts and stays up
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then Xvfb :99 -screen 0 1280x800x24 & export DISPLAY=:99; sleep 2; fi
          ./dist/whiteboard-client-check${{ matrix.ext }} > client.log 2>&1 &
          PID=$!
          sleep 15
          cat client.log
          if ! kill -0 $PID 2>/dev/null; then echo "client exited early"; exit 1; fi
          echo "client is running after 15 s"
          kill $PID || true

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp dist/whiteboard-server${{ matrix.ext }} out/
          cp dist/whiteboard-client${{ matrix.ext }} out/
          cp README.md out/

      - uses: actions/upload-artifact@v4
        with:
          name: whiteboard-${{ matrix.label }}
          path: out/

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q xvfb libportaudio2; fi
          pip install pillow cryptography qrcode
      - name: Run every test file (reports all results, fails if any failed)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then Xvfb :99 -screen 0 1280x800x24 & export DISPLAY=:99; sleep 2; fi
          failed=""
          for t in tests/test_*.py; do
            echo "::group::$t"
            if timeout 300 python "$t"; then echo "PASS $t"; else echo "FAIL $t"; failed="$failed $t"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "Failed:$failed"; exit 1; fi
          echo "All tests passed"

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Zip and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cd art
          chmod +x whiteboard-linux/whiteboard-server whiteboard-linux/whiteboard-client
          (cd whiteboard-windows && zip -q ../whiteboard-windows.zip *)
          tar -czf whiteboard-linux.tar.gz -C whiteboard-linux .
          cp whiteboard-windows/whiteboard-server.exe whiteboard-windows/whiteboard-client.exe .
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Whiteboard $TAG" \
            --notes "Windows: download whiteboard-windows.zip (or the two .exe files). Linux: whiteboard-linux.tar.gz, then chmod +x. See README for how to run." \
            whiteboard-windows.zip whiteboard-linux.tar.gz whiteboard-server.exe whiteboard-client.exe
